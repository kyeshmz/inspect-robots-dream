[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.3", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-dream"
dynamic = ["version", "readme"]
description = "Inspect Robots policy adapter for Dream Labs' Dream-1 robot model, called through the Dream API."
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RoboCurve" }]
keywords = ["robotics", "vla", "dream-1", "dreamlabs", "yam", "inspect-robots"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "inspect-robots>=0.60",
    # The service refuses any 0.x client (DA-4000 client_outdated).
    "dreamlabs-client>=1.0.3,<2",
    "numpy>=1.24,<3",
    "pillow>=10,<13",
]

[project.optional-dependencies]
# Dream's IK (dream_ik), which the client needs to add the hand poses dream-1-beta reads.
# Python 3.11+, and it brings jax and mujoco.
ik = ["dreamlabs>=1.0.5,<2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/kyeshmz/inspect-robots-dream"
Framework = "https://github.com/robocurve/inspect-robots"
"Dream Labs" = "https://platform.dreamlabs.ai/docs/"

# Inspect Robots discovers this by entry point; no import needed for `inspect-robots list`.
[project.entry-points."inspect_robots.policies"]
dream = "inspect_robots_dream.policy:DreamPolicy"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_dream"]

[tool.hatch.build.targets.sdist]
include = ["/src/inspect_robots_dream", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
fallback_version = "0.0.0"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "D1"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots_dream"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["inspect_robots_dream"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/inspect_robots_dream"]
